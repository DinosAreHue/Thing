<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factions</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #ddd;
    font-family: Arial, sans-serif;
    color: #000;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

/* WHITE BOXES */

.box {
    background: white;
    border: 2px solid black;
    padding: 12px;
    margin-bottom: 12px;
}

/* ADD */

.add {
    display: flex;
    gap: 5px;
}

input {
    flex: 1;
    height: 40px;
    border: 2px solid black;
    padding: 8px;
    font-size: 16px;
    border-radius: 0;
}

button {
    background: white;
    border: 2px solid black;
    padding: 7px 10px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 0;
}

button:hover {
    background: #ddd;
}

/* FACTIONS */

.faction {
    background: white;
    border: 2px solid black;
    padding: 10px;
    margin-bottom: 8px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.name {
    font-weight: bold;
    font-size: 18px;
}

.points {
    margin-top: 3px;
}

/* CONTROLS */

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
}

/* CHART */

.chart {
    height: 500px;
}

/* MOBILE */

@media (max-width: 800px) {

    .main {
        grid-template-columns: 1fr;
    }

    .faction {
        flex-direction: column;
        align-items: flex-start;
    }

    .controls {
        justify-content: flex-start;
    }

}

</style>

</head>

<body>

<div class="container">

```
<div class="main">

    <div>

        <div class="box">

            <div class="add">

                <input
                    id="factionName"
                    placeholder="Faction"
                >

                <button onclick="addFaction()">
                    Add
                </button>

            </div>

        </div>

        <div id="factionList"></div>

    </div>


    <div class="box">

        <div class="chart">
            <canvas id="factionChart"></canvas>
        </div>

    </div>

</div>
```

</div>

<script>

let factions =
    JSON.parse(localStorage.getItem("factions")) || [];

let chart;


/* SAVE */

function save() {

    localStorage.setItem(
        "factions",
        JSON.stringify(factions)
    );

}


/* ADD */

function addFaction() {

    const input =
        document.getElementById("factionName");

    const name =
        input.value.trim();

    if (!name) return;

    if (
        factions.some(
            f =>
                f.name.toLowerCase()
                === name.toLowerCase()
        )
    ) {

        alert("Already exists.");

        return;

    }

    factions.push({

        id: Date.now(),

        name: name,

        points: 0

    });

    input.value = "";

    save();

    render();

}


/* POINTS */

function changePoints(id, amount) {

    const faction =
        factions.find(
            f => f.id === id
        );

    if (!faction) return;

    faction.points += amount;

    if (faction.points < 0)
        faction.points = 0;

    save();

    render();

}


/* RENAME */

function renameFaction(id) {

    const faction =
        factions.find(
            f => f.id === id
        );

    if (!faction) return;

    const name =
        prompt(
            "New name:",
            faction.name
        );

    if (name === null) return;

    const newName =
        name.trim();

    if (!newName) return;

    faction.name = newName;

    save();

    render();

}


/* DELETE */

function deleteFaction(id) {

    factions =
        factions.filter(
            f => f.id !== id
        );

    save();

    render();

}


/* FACTIONS */

function renderFactions() {

    const list =
        document.getElementById(
            "factionList"
        );

    list.innerHTML = "";

    factions.forEach(
        faction => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "faction";

            div.innerHTML = `

                <div>

                    <div class="name">
                        ${escapeHTML(faction.name)}
                    </div>

                    <div class="points">
                        ${faction.points.toLocaleString()}
                    </div>

                </div>

                <div class="controls">

                    <button onclick="changePoints(${faction.id}, -100)">
                        -100
                    </button>

                    <button onclick="changePoints(${faction.id}, -10)">
                        -10
                    </button>

                    <button onclick="changePoints(${faction.id}, -1)">
                        -1
                    </button>

                    <button onclick="changePoints(${faction.id}, 1)">
                        +1
                    </button>

                    <button onclick="changePoints(${faction.id}, 10)">
                        +10
                    </button>

                    <button onclick="changePoints(${faction.id}, 100)">
                        +100
                    </button>

                    <button onclick="renameFaction(${faction.id})">
                        Edit
                    </button>

                    <button onclick="deleteFaction(${faction.id})">
                        X
                    </button>

                </div>

            `;

            list.appendChild(div);

        }
    );

}


/* CHART */

function updateChart() {

    const canvas =
        document.getElementById(
            "factionChart"
        );

    const labels =
        factions.map(
            f => f.name
        );

    const values =
        factions.map(
            f => f.points
        );

    const total =
        values.reduce(
            (a, b) => a + b,
            0
        );

    if (chart)
        chart.destroy();

    chart =
        new Chart(
            canvas,
            {

                type: "pie",

                data: {

                    labels: labels,

                    datasets: [

                        {
                            data: values
                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {
                            position: "bottom"
                        },

                        tooltip: {

                            callbacks: {

                                label: function(context) {

                                    if (total === 0)
                                        return context.label;

                                    const percent =
                                        (
                                            context.raw /
                                            total
                                        ) * 100;

                                    return (
                                        context.label +
                                        ": " +
                                        context.raw +
                                        " (" +
                                        percent.toFixed(1) +
                                        "%)"
                                    );

                                }

                            }

                        }

                    }

                }

            }
        );

}


/* ESCAPE */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ENTER */

document
    .getElementById("factionName")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter")
                addFaction();

        }
    );


/* START */

function render() {

    renderFactions();

    updateChart();

}

render();

</script>

</body>
</html>
